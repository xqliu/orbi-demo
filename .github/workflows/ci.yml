name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check server and list branch coverage
        if: matrix.node == 22
        run: node --test --experimental-test-coverage --test-coverage-include=scripts/server.js --test-coverage-include=src/todo.js --test-coverage-branches=95 test/server.test.js test/todo.test.js
